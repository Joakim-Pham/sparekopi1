<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#162440"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf7f0"/>
      <stop offset="100%" stop-color="#f2ede3"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8922e"/>
      <stop offset="100%" stop-color="#d4a843"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="100" x2="800" y2="100" stroke="#d4a843" stroke-width="1"/>
    <line x1="0" y1="200" x2="800" y2="200" stroke="#d4a843" stroke-width="1"/>
    <line x1="0" y1="300" x2="800" y2="300" stroke="#d4a843" stroke-width="1"/>
    <line x1="0" y1="400" x2="800" y2="400" stroke="#d4a843" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="500" stroke="#d4a843" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="500" stroke="#d4a843" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="500" stroke="#d4a843" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="500" stroke="#d4a843" stroke-width="1"/>
  </g>

  <!-- Browser window shadow -->
  <rect x="102" y="82" width="596" height="356" rx="10" fill="#000" opacity="0.4"/>

  <!-- Browser window frame -->
  <rect x="100" y="80" width="596" height="356" rx="10" fill="#1e2d45"/>

  <!-- Browser top bar -->
  <rect x="100" y="80" width="596" height="36" rx="10" fill="#243450"/>
  <rect x="100" y="96" width="596" height="20" fill="#243450"/>

  <!-- Browser dots -->
  <circle cx="124" cy="98" r="5" fill="#e05c5c" opacity="0.9"/>
  <circle cx="142" cy="98" r="5" fill="#e0a95c" opacity="0.9"/>
  <circle cx="160" cy="98" r="5" fill="#5ce07a" opacity="0.9"/>

  <!-- URL bar -->
  <rect x="185" y="88" width="280" height="20" rx="4" fill="#0c1a2e" opacity="0.6"/>
  <text x="325" y="102" font-family="'DM Sans', monospace, sans-serif" font-size="9" fill="#d4a843" opacity="0.8" text-anchor="middle">sparekopi.no</text>

  <!-- Screen content area -->
  <rect x="100" y="116" width="596" height="320" fill="url(#screenGrad)"/>

  <!-- Nav bar in screen -->
  <rect x="100" y="116" width="596" height="32" fill="#0c1a2e"/>
  <rect x="116" y="126" width="60" height="12" rx="2" fill="#d4a843" opacity="0.9"/>
  <rect x="410" y="129" width="36" height="6" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="460" y="129" width="36" height="6" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="510" y="129" width="36" height="6" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="562" y="124" width="60" height="16" rx="2" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <text x="592" y="135" font-family="sans-serif" font-size="7" fill="rgba(255,255,255,0.6)" text-anchor="middle">Kontakt</text>

  <!-- Hero section -->
  <rect x="100" y="148" width="596" height="100" fill="#f5f0e8"/>
  <!-- Hero text lines -->
  <rect x="130" y="165" width="180" height="8" rx="2" fill="#0c1a2e" opacity="0.15"/>
  <rect x="130" y="180" width="240" height="18" rx="2" fill="#0c1a2e" opacity="0.8"/>
  <rect x="130" y="204" width="200" height="18" rx="2" fill="#b8922e" opacity="0.7"/>
  <rect x="130" y="228" width="90" height="16" rx="2" fill="#0c1a2e"/>

  <!-- Hero image placeholder -->
  <rect x="490" y="155" width="180" height="85" rx="4" fill="#d4c4a0" opacity="0.5"/>
  <rect x="520" y="170" width="60" height="5" rx="1" fill="#b8922e" opacity="0.4"/>
  <rect x="510" y="182" width="120" height="4" rx="1" fill="#0c1a2e" opacity="0.2"/>
  <rect x="510" y="192" width="100" height="4" rx="1" fill="#0c1a2e" opacity="0.2"/>
  <rect x="510" y="202" width="110" height="4" rx="1" fill="#0c1a2e" opacity="0.2"/>
  <rect x="510" y="212" width="80" height="4" rx="1" fill="#0c1a2e" opacity="0.15"/>

  <!-- Services grid section -->
  <rect x="100" y="248" width="596" height="8" fill="#e8e0d0"/>
  <!-- Card 1 -->
  <rect x="116" y="264" width="165" height="100" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="116" y="264" width="165" height="42" rx="3" fill="#d4c4a0" opacity="0.5"/>
  <rect x="126" y="318" width="80" height="6" rx="1" fill="#0c1a2e" opacity="0.7"/>
  <rect x="126" y="330" width="120" height="4" rx="1" fill="#0c1a2e" opacity="0.2"/>
  <rect x="126" y="340" width="100" height="4" rx="1" fill="#0c1a2e" opacity="0.15"/>
  <!-- Card 2 -->
  <rect x="298" y="264" width="165" height="100" rx="3" fill="#fff" opacity="0.8"/>
  <rect x="298" y="264" width="165" height="42" rx="3" fill="#d4c4a0" opacity="0.5"/>
  <rect x="308" y="318" width="80" height="6" rx="1" fill="#0c1a2e" opacity="0.7"/>
  <rect x="308" y="330" width="120" height="4" rx="1" fill="#0c1a2e" opacity="0.2"/>
  <rect x="308" y="340" width="100" height="4" rx="1" fill="#0c1a2e" opacity="0.15"/>
  <!-- Card 3 (highlighted with gold) -->
  <rect x="480" y="264" width="200" height="100" rx="3" fill="#fff" opacity="0.9"/>
  <rect x="480" y="264" width="200" height="42" rx="3" fill="url(#goldGrad)" opacity="0.3"/>
  <rect x="490" y="310" width="2" height="44" fill="#b8922e" opacity="0.6"/>
  <rect x="500" y="316" width="90" height="7" rx="1" fill="#0c1a2e" opacity="0.8"/>
  <rect x="500" y="329" width="150" height="4" rx="1" fill="#0c1a2e" opacity="0.2"/>
  <rect x="500" y="339" width="130" height="4" rx="1" fill="#0c1a2e" opacity="0.15"/>
  <rect x="500" y="349" width="80" height="4" rx="1" fill="#b8922e" opacity="0.5"/>

  <!-- Footer bar in screen -->
  <rect x="100" y="372" width="596" height="32" fill="#0c1a2e" opacity="0.95"/>
  <rect x="116" y="381" width="50" height="6" rx="1" fill="#d4a843" opacity="0.6"/>
  <rect x="410" y="383" width="30" height="4" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="450" y="383" width="30" height="4" rx="1" fill="rgba(255,255,255,0.2)"/>
  <rect x="490" y="383" width="30" height="4" rx="1" fill="rgba(255,255,255,0.2)"/>

  <!-- Decorative code lines (left of browser) -->
  <g opacity="0.25" font-family="monospace" font-size="10" fill="#d4a843">
    <text x="20" y="140">&lt;nav&gt;</text>
    <text x="14" y="158">  &lt;a&gt;logo&lt;/a&gt;</text>
    <text x="20" y="176">&lt;/nav&gt;</text>
    <text x="20" y="210">&lt;section&gt;</text>
    <text x="14" y="228">  &lt;h1&gt;...&lt;/h1&gt;</text>
    <text x="20" y="246">&lt;/section&gt;</text>
    <text x="20" y="280">.card {</text>
    <text x="14" y="298">  display: grid;</text>
    <text x="20" y="316">}</text>
  </g>

  <!-- Decorative code lines (right of browser) -->
  <g opacity="0.2" font-family="monospace" font-size="10" fill="#d4a843">
    <text x="714" y="155">fetch(</text>
    <text x="708" y="173">  '/api'</text>
    <text x="714" y="191">)</text>
    <text x="714" y="225">.then(</text>
    <text x="708" y="243">  data =&gt;</text>
    <text x="714" y="261">)</text>
  </g>

  <!-- Gold accent dot -->
  <circle cx="400" cy="460" r="3" fill="#d4a843" opacity="0.7"/>
  <line x1="350" y1="460" x2="390" y2="460" stroke="#d4a843" stroke-width="1" opacity="0.3"/>
  <line x1="410" y1="460" x2="450" y2="460" stroke="#d4a843" stroke-width="1" opacity="0.3"/>

  <!-- Bottom label -->
  <text x="400" y="478" font-family="'DM Sans', sans-serif" font-size="11" fill="#d4a843" opacity="0.5" text-anchor="middle" letter-spacing="4">NETTSIDE &amp; WEBUTVIKLING</text>
</svg>
